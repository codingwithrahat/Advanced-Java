<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" th:href="@{/css/styleForm.css}">
</head>
<body>
<h1>Product form</h1>

<form method="post" th:action="${isUpdate} ? @{/product/update/{id}(id=${product.id != null ? product.id : 0})} : @{/product/add}" th:object="${product}">
    <input type="hidden" th:field="*{id}">

    <label>Product Name</label>
    <input type="text" th:field="*{name}"><br>
    <span th:errors="*{name}" style="color: red"></span>
    <br><br>

    <label>Product Category</label>
    <input type="text" th:field="*{category}"><br>
    <span th:errors="*{category}" style="color: red"></span>
    <br><br>

    <label>Stock</label>
    <input type="number" th:field="*{stock}"><br>
    <span th:errors="*{stock}" style="color: red"></span>
    <br><br>

    <label>Price</label>
    <input type="number" th:field="*{price}"><br>
    <span th:errors="*{price}" style="color: red"></span>
    <br><br>

    <button type="submit" th:text="${isUpdate} ? 'Update Product' : 'Add Product'">Add Product</button>

    <br><br>

    <a th:href="@{/product/list}">back to list</a>
</form>
</body>
</html>
