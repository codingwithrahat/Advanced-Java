<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Guests</title>
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Guests</h2>

    <a th:href="@{/guests/add}" class="btn btn-primary mb-3">Add Guest</a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Mobile</th>
                <th>Passport Number</th>
                <th>Passport Expiry</th>
                <th>Country</th>
                <th>Sea View</th>
                <th>Extra Bed</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="g : ${guests}">
                <td th:text="${g.name}"></td>
                <td th:text="${g.email}"></td>
                <td th:text="${g.mobile}"></td>
                <td th:text="${g.passportNumber}"></td>
                <td th:text="${g.passportExpiryDate}"></td>
                <td th:text="${g.passportCountry}"></td>
                <td th:text="${g.seaView} ? 'Yes' : 'No'"></td>
                <td th:text="${g.extraBed} ? 'Yes' : 'No'"></td>
                <td>
                    <a th:href="@{/guests/edit/{id}(id=${g.id})}" class="btn btn-sm btn-warning">Update</a>
                    <a th:href="@{/guests/delete/{id}(id=${g.id})}" class="btn btn-sm btn-danger"
                       onclick="return confirm('Are you sure you want to delete this guest?');">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
