<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Booking Form</title>
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4" th:text="${booking.id} == null ? 'Add Booking' : 'Update Booking'"></h2>

    <form th:action="@{/bookings/save}" th:object="${booking}" method="post">

        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Guest Name</label>
            <input type="text" class="form-control" th:field="*{guestName}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Guest Email</label>
            <input type="email" class="form-control" th:field="*{guestEmail}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Floor</label>
            <input type="text" class="form-control" th:field="*{floor}">
        </div>

        <div class="mb-3">
            <label class="form-label">Room Number</label>
            <input type="text" class="form-control" th:field="*{roomNumber}">
        </div>

        <div class="mb-3">
            <label class="form-label">Check In Date</label>
            <input type="date" class="form-control" th:field="*{checkInDate}">
        </div>

        <div class="mb-3">
            <label class="form-label">Check Out Date</label>
            <input type="date" class="form-control" th:field="*{checkOutDate}">
        </div>

        <div class="mb-3">
            <label class="form-label">Amount</label>
            <input type="number" step="0.01" class="form-control" th:field="*{amount}">
        </div>

        <div class="mb-3">
            <label class="form-label">Payment Status</label>
            <select class="form-select" th:field="*{paymentStatus}">
                <option value="pending">Pending</option>
                <option value="paid">Paid</option>
                <option value="unpaid">Unpaid</option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Save</button>
        <a th:href="@{/bookings}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
