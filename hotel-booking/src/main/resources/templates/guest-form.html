<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Guest Form</title>
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4" th:text="${guest.id} == null ? 'Add Guest' : 'Update Guest'"></h2>

    <form th:action="@{/guests/save}" th:object="${guest}" method="post">

        <input type="hidden" th:field="*{id}"/>

        <h5 class="mt-3 mb-3">Basic Info</h5>

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" th:field="*{name}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Mobile</label>
            <input type="text" class="form-control" th:field="*{mobile}" required>
        </div>

        <h5 class="mt-4 mb-3">Passport Information</h5>

        <div class="mb-3">
            <label class="form-label">Passport Number</label>
            <input type="text" class="form-control" th:field="*{passportNumber}">
        </div>

        <div class="mb-3">
            <label class="form-label">Passport Expiry Date</label>
            <input type="date" class="form-control" th:field="*{passportExpiryDate}">
        </div>

        <div class="mb-3">
            <label class="form-label">Country</label>
            <input type="text" class="form-control" th:field="*{passportCountry}">
        </div>

        <h5 class="mt-4 mb-3">Special Requests</h5>

        <div class="form-check mb-2">
            <input type="checkbox" class="form-check-input" th:field="*{seaView}">
            <label class="form-check-label">Sea View</label>
        </div>

        <div class="form-check mb-4">
            <input type="checkbox" class="form-check-input" th:field="*{extraBed}">
            <label class="form-check-label">Extra Bed</label>
        </div>

        <button type="submit" class="btn btn-success">Save</button>
        <a th:href="@{/guests}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
